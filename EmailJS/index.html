<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto - EmailJS</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
</head>
<body class="fondo d-flex align-items-center min-vh-100 py-4">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 fw-bold titulo mb-1">
                            <i class="bi bi-envelope-paper-heart"></i> Formulario de contacto
                        </h1>
                        <p class="text-secondary mb-4">Completa tus datos y recibirás un correo de confirmación.</p>

                        <form id="formulario" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej.: Eliana María">
                                    <div class="invalid-feedback" id="error-nombre"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="tucorreo@undc.edu.pe">
                                    <div class="invalid-feedback" id="error-correo"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="asunto" class="form-label fw-semibold">Asunto</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-chat-left-text"></i></span>
                                    <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Motivo del mensaje">
                                    <div class="invalid-feedback" id="error-asunto"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>
                                <div class="invalid-feedback" id="error-mensaje"></div>
                            </div>

                            <button type="submit" id="btn-enviar" class="btn btn-principal btn-lg w-100">
                                <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                                <span id="texto-boton"><i class="bi bi-send"></i> Enviar</span>
                            </button>
                        </form>

                        <div id="notificacion" class="alert mt-4 mb-0 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
